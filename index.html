<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F1 — Las Vegas Grand Prix</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="loading-screen">
  <div class="f1-logo">F1</div>
  <div class="loading-text">LOADING LAS VEGAS...</div>
</div>

<canvas id="game-canvas"></canvas>

<!-- race HUD (built by HUD.js) -->
<div id="hud"></div>

<!-- pause -->
<div id="pause-overlay" class="overlay">
  <h2>일시정지</h2>
  <button id="btn-resume" class="overlay-btn">▶ 계속하기</button>
  <button id="btn-pause-restart" class="overlay-btn">↺ 다시 시작</button>
  <button id="btn-pause-menu" class="overlay-btn">⏮ 메인 메뉴</button>
</div>

<!-- race results -->
<div id="results-overlay" class="overlay">
  <h2 id="results-title">🏁 레이스 완료</h2>
  <div class="res-head">
    <span class="r-pos">P</span><span class="r-chip"></span><span class="r-code">드라이버</span>
    <span class="r-team">팀</span><span class="r-best">베스트 랩</span><span class="r-gap">기록</span>
  </div>
  <div id="results-rows"></div>
  <div class="overlay-row">
    <button id="btn-res-restart" class="overlay-btn">↺ 다시 시작</button>
    <button id="btn-res-menu" class="overlay-btn">⏮ 메인 메뉴</button>
  </div>
</div>

<!-- main menu (built by Menu.js) -->
<div id="menu" style="display:none"></div>

<!-- Three.js r158 (UMD, vendored — r160+ dropped the non-module build) -->
<script src="js/lib/three.min.js"></script>

<!-- game modules: data → physics → world → systems → orchestrators -->
<script src="js/tracks/lasvegas.js"></script>
<script src="js/Car.js"></script>
<script src="js/Track.js"></script>
<script src="js/AI.js"></script>
<script src="js/Effects.js"></script>
<script src="js/Buildings.js"></script>
<script src="js/HUD.js"></script>
<script src="js/AudioManager.js"></script>
<script src="js/Game.js"></script>
<script src="js/Menu.js"></script>
<script src="js/main.js"></script>

</body>
</html>
